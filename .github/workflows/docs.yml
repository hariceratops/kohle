name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The build installs the app too: the CLI reference and the plugin list
  # import kohle. --frozen so a stale lock does not turn the docs check red.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --frozen --with-requirements docs/requirements.txt mkdocs build --strict -f docs/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
